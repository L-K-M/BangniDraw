# CI: prove every push to main and every PR — unit tests, Android lint, a
# debug APK uploaded as a rolling artifact, and both release configurations
# (the shipped one and the Mixbox-stripped one).
#
# Hardening (family contract):
#   - least-privilege token (contents: read)
#   - cancel superseded PR runs, but never an in-progress main run — a
#     permanently "cancelled" main commit masks breakage and breaks bisection
#   - timeout on every job so a wedged Gradle daemon can't burn runner hours

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Supply-chain gate: reject a tampered gradle-wrapper.jar.
      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # No explicit SDK install step: the ubuntu runner image ships the Android
      # SDK, and AGP resolves compileSdk android-37.0 against it (paired with
      # android.suppressUnsupportedCompileSdk in gradle.properties).
      - uses: gradle/actions/setup-gradle@v6

      - name: Lint shell scripts
        run: bash -n scripts/*.sh

      - name: Test, lint, and assemble
        # The KMP libraries register no Android unit tests; their JVM suites
        # run on the desktop targets (DESKTOP.md Phase 1, M1/M2), and the
        # desktop shell's own tests ride the same job (M4).
        run: >-
          ./gradlew testDebugUnitTest lintDebug assembleDebug
          :engine-core:desktopTest :engine-gl:desktopTest :desktop:test

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: bangnidraw-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # The configuration that actually ships: release.yml's "Build release
      # APK" step runs exactly this — Mixbox in, R8 on — and until this step
      # existed nothing built it before a v* tag was already pushed. Neither
      # of the other two covers it: assembleDebug is unminified, and the
      # stripped release below swaps the source set R8 traverses. AGENTS.md's
      # own rule is that "works in debug, breaks in release" is almost always
      # a missing keep rule for a new reflection or serialization entry
      # point, and :engine-core and :engine-gl became separate modules three
      # PRs ago, so R8 now crosses a boundary that did not exist when
      # proguard-rules.pro was written.
      - name: Assemble the shipped release configuration
        run: ./gradlew assembleRelease

      # The stripped source set and its R8 graph differ from the default APK.
      - name: Assemble release without Mixbox
        run: ./gradlew -Pbangnidraw.mixbox=false assembleRelease

  # The desktop shell (DESKTOP.md Phase 1/2): JVM suites plus the jpackage
  # distributable. Ubuntu only — there is no cross-compilation, so macOS
  # packaging lives in the dispatched job below.
  desktop-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Supply-chain gate: reject a tampered gradle-wrapper.jar.
      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Linux desktop smoke dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libegl1 libgles2 libgl1-mesa-dri xauth xvfb

      - name: Test and build the desktop distributable
        # packageDeb exercises the deb metadata (version/vendor/charset)
        # that createDistributable never touches; rpmbuild is absent on
        # ubuntu runners, so Rpm stays a manual format. mixbox=false here is
        # deliberate coverage: this job pins the stripped desktop variant
        # (D12's gap); the default/Mixbox variant is only built when the
        # dispatched macOS job runs, not on every commit.
        run: >-
          ./gradlew :engine-core:desktopTest :engine-gl:desktopTest
          :desktop:test :desktop:createDistributable :desktop:packageDeb
          -Pbangnidraw.mixbox=false

      - name: Verify Linux desktop package
        run: |
          DEB="$(find desktop/build/compose/binaries/main/deb -name '*.deb' -print -quit)"
          test "$(dpkg-deb -f "$DEB" Package)" = "bangnidraw"
          test "$(dpkg-deb -f "$DEB" Maintainer)" = "L-K-M <L-K-M@users.noreply.github.com>"

          ROOT="$RUNNER_TEMP/bangnidraw-deb"
          dpkg-deb -x "$DEB" "$ROOT"
          DESKTOP_ENTRY="$(find "$ROOT" -name '*.desktop' -print -quit)"
          grep -Fx 'Name=帮你Draw' "$DESKTOP_ENTRY"
          grep -Fx 'Categories=Graphics' "$DESKTOP_ENTRY"

          ICON_PATH="$(sed -n 's/^Icon=//p' "$DESKTOP_ENTRY")"
          ICON="$ROOT$ICON_PATH"
          test "$(sha256sum "$ICON" | cut -d ' ' -f 1)" = \
            "$(sha256sum desktop/packaging/icons/bangnidraw.png | cut -d ' ' -f 1)"

          LAUNCHER="$(find desktop/build/compose/binaries/main/app -path '*/bin/*' ! -path '*/runtime/*' -type f -executable -print -quit)"
          timeout 60s "$LAUNCHER" --verify-runtime | grep -F '帮你Draw runtime OK:'

          LIBGL_ALWAYS_SOFTWARE=1 timeout 30s xvfb-run -a \
            "$LAUNCHER" --smoke-window 2>&1 | tee "$RUNNER_TEMP/desktop-smoke.log"
          grep -F '帮你Draw window OK:' "$RUNNER_TEMP/desktop-smoke.log"

          # Both context hosts, every commit: the direct EGL path is the one
          # macOS depends on, and GLFW is only a safety net if it still works.
          for HOST in egl glfw; do
            JAVA_TOOL_OPTIONS="-Dbangnidraw.gl.host=$HOST" LIBGL_ALWAYS_SOFTWARE=1 \
              timeout 30s xvfb-run -a "$LAUNCHER" --gl-report 2>&1 | \
              tee "$RUNNER_TEMP/desktop-gl-$HOST.log"
            grep -iF "GLES 3.0 context via $HOST" "$RUNNER_TEMP/desktop-gl-$HOST.log"
          done

      - name: Upload desktop distributable
        uses: actions/upload-artifact@v7
        with:
          name: bangnidraw-desktop-linux-nomixbox-${{ github.sha }}
          path: desktop/build/compose/binaries/main/**
          if-no-files-found: error
          retention-days: 14

  # macOS build: Dmg packaging and the ANGLE-on-Metal context can only be
  # produced on macOS hardware, and macOS minutes cost 10x — dispatch only.
  desktop-macos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Test and build the macOS distributable
        # packageDistributionForCurrentOS = the real Dmg on macOS. Built
        # with pinned ANGLE and Mixbox; Linux covers the stripped variant.
        run: >-
          ./gradlew :engine-core:desktopTest :engine-gl:desktopTest
          :desktop:test :desktop:createDistributable
          :desktop:packageDistributionForCurrentOS

      - name: Verify macOS desktop package
        run: |
          APP="$(find desktop/build/compose/binaries/main/app -name '*.app' -print -quit)"
          PLIST="$APP/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$PLIST")" = "帮你Draw"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PLIST")" = "帮你Draw"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")" = \
            "ch.lkmc.bangnidraw.desktop"

          ICON_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$PLIST")"
          ICON="$APP/Contents/Resources/$ICON_NAME"
          test "$(shasum -a 256 "$ICON" | cut -d ' ' -f 1)" = \
            "$(shasum -a 256 desktop/packaging/icons/bangnidraw.icns | cut -d ' ' -f 1)"

          LAUNCHER="$(find "$APP/Contents/MacOS" -type f -print -quit)"
          test -x "$LAUNCHER"
          perl -e 'alarm shift; exec @ARGV' 60 "$LAUNCHER" --verify-runtime | grep -F '帮你Draw runtime OK:'

          ANGLE_RESOURCES="$APP/Contents/app/resources"
          EGL="$ANGLE_RESOURCES/libEGL.dylib"
          GLES="$ANGLE_RESOURCES/libGLESv2.dylib"
          LICENSE="$ANGLE_RESOURCES/LICENSE"
          NOTICES="$ANGLE_RESOURCES/LICENSES.chromium.html"
          test -f "$EGL"
          test -f "$GLES"
          test -f "$LICENSE"
          test -f "$NOTICES"

          NATIVE_ARCH="$(uname -m)"
          case "$NATIVE_ARCH" in
            arm64|x86_64) ;;
            *) echo "!! unsupported macOS architecture: $NATIVE_ARCH" >&2; exit 1 ;;
          esac
          test "$(lipo -archs "$EGL")" = "$NATIVE_ARCH"
          test "$(lipo -archs "$GLES")" = "$NATIVE_ARCH"
          # Upstream signs the arm64 ANGLE ad-hoc and ships the x86_64 build
          # unsigned, so a strict verify on Intel would fail on a good file.
          if [ "$NATIVE_ARCH" = arm64 ]; then
            codesign --verify --strict "$EGL"
            codesign --verify --strict "$GLES"
          fi

          perl -e 'alarm shift; exec @ARGV' 60 \
            "$LAUNCHER" --smoke-window 2>&1 | \
            tee "$RUNNER_TEMP/desktop-macos-smoke.log"
          grep -F '帮你Draw window OK:' "$RUNNER_TEMP/desktop-macos-smoke.log"
          grep -E 'I/EglEsContext: GL context: .*ANGLE' \
            "$RUNNER_TEMP/desktop-macos-smoke.log"

          # macOS has one host: the packaged app must reach ANGLE through EGL
          # directly, on the Metal display rather than ANGLE's default.
          perl -e 'alarm shift; exec @ARGV' 60 "$LAUNCHER" --gl-report 2>&1 | \
            tee "$RUNNER_TEMP/desktop-macos-gl.log"
          grep -F 'GLES 3.0 context via EGL' "$RUNNER_TEMP/desktop-macos-gl.log"
          grep -F 'EGL display: ANGLE/Metal' "$RUNNER_TEMP/desktop-macos-gl.log"
          grep -E 'GL context: .*ANGLE' "$RUNNER_TEMP/desktop-macos-gl.log"

      - name: Verify the unpackaged developer run
        # README's own instruction, and the one path this job never covered:
        # `gradlew run` forks the JDK's own java rather than jpackage's
        # launcher, and an entitlement-signed main executable can lose AMFI's
        # allowAtPaths — after which dyld never searches the working directory
        # for the leaf-name dlopen GLFW uses to find a bundled ANGLE.
        run: |
          ./gradlew :desktop:run --args=--gl-report 2>&1 | \
            tee "$RUNNER_TEMP/desktop-macos-run.log"
          grep -F 'GLES 3.0 context via EGL' "$RUNNER_TEMP/desktop-macos-run.log"

      - name: Upload macOS distributable
        # The archive contains the verified ANGLE runtime exercised above.
        uses: actions/upload-artifact@v7
        with:
          name: bangnidraw-desktop-macos-${{ github.sha }}
          path: desktop/build/compose/binaries/main/**
          if-no-files-found: error
          retention-days: 14
