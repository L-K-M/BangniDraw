# Release: a pushed v* tag builds, verifies, and publishes the release APK
# plus the desktop distributables (Linux deb, macOS dmg — DESKTOP.md Phase
# 2; there is no cross-compilation, so each format builds on its own OS).
#
# Signing: BOTH build types are signed with the checked-in app/debug.keystore —
# zero secrets, reproducible by anyone, deliberately sideload-only
# (docs/decisions/0005). Switching to a real key later breaks upgrades for
# every installed user, which is why this was decided on day one.
#
# The desktop packages are the DEFAULT (Mixbox-enabled) variant, matching the
# APK's licensing posture (CC BY-NC 4.0, ADR 0003). The macOS dmg bundles
# pinned, verified ANGLE dylibs fetched while Gradle stages app resources.
#
# Hardening (family contract): least-privilege permissions, no cancellation
# (a half-cancelled publish is worse than a slow one), timeout, wrapper
# validation before any Gradle execution, and a tag↔versionName gate so a tag
# can only publish the version the commit actually declares.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # The committed versionName at the tagged commit is the source of truth;
      # the tag only names the Release. Same sed pattern scripts/release.sh's
      # engine writes with, so this gate accepts everything the bumper produces.
      - name: Verify tag matches committed versionName
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          COMMITTED="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]*)".*$/\1/p' app/build.gradle.kts | head -n 1)"
          if [ "$VERSION" != "$COMMITTED" ]; then
            echo "!! tag v$VERSION does not match committed versionName $COMMITTED" >&2
            echo "!! re-cut the release with scripts/release.sh" >&2
            exit 1
          fi

      # Re-prove the tagged commit: a tag can land on a commit CI never saw.
      - name: Test and lint
        run: ./gradlew testDebugUnitTest lintDebug

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Stage release artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/bangnidraw-${GITHUB_REF_NAME}.apk"
          (cd dist && sha256sum "bangnidraw-${GITHUB_REF_NAME}.apk" > "bangnidraw-${GITHUB_REF_NAME}.apk.sha256")

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bangnidraw-release-apk-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  build-desktop-linux:
    name: Build Linux desktop package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install Linux desktop smoke dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libegl1 libgles2 libgl1-mesa-dri xauth xvfb

      - name: Build desktop tests and deb
        run: >-
          ./gradlew :engine-core:desktopTest :engine-gl:desktopTest
          :desktop:test :desktop:createDistributable
          :desktop:packageDeb

      - name: Verify Linux package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DEB_VERSION="${VERSION/-/~}"
          DEB="$(find desktop/build/compose/binaries/main/deb -name '*.deb' -print -quit)"
          PACKAGE_VERSION="$(dpkg-deb -f "$DEB" Version)"
          PACKAGE_ID="$(dpkg-deb -f "$DEB" Package)"
          case "$PACKAGE_VERSION" in
            "$DEB_VERSION"|"$DEB_VERSION-"*) ;;
            *)
              echo "!! deb version $PACKAGE_VERSION does not match $DEB_VERSION" >&2
              exit 1
              ;;
          esac
          test "$PACKAGE_ID" = "bangnidraw"

          ROOT="$RUNNER_TEMP/bangnidraw-deb"
          dpkg-deb -x "$DEB" "$ROOT"
          DESKTOP_ENTRY="$(find "$ROOT" -name '*.desktop' -print -quit)"
          grep -Fx 'Name=帮你Draw' "$DESKTOP_ENTRY"
          grep -Fx 'Categories=Graphics' "$DESKTOP_ENTRY"

          ICON_PATH="$(sed -n 's/^Icon=//p' "$DESKTOP_ENTRY")"
          ICON="$ROOT$ICON_PATH"
          test "$(sha256sum "$ICON" | cut -d ' ' -f 1)" = \
            "$(sha256sum desktop/packaging/icons/bangnidraw.png | cut -d ' ' -f 1)"

          LAUNCHER="$(find desktop/build/compose/binaries/main/app -path '*/bin/*' ! -path '*/runtime/*' -type f -executable -print -quit)"
          timeout 60s "$LAUNCHER" --verify-runtime | grep -F '帮你Draw runtime OK:'

          LIBGL_ALWAYS_SOFTWARE=1 timeout 30s xvfb-run -a "$LAUNCHER" --smoke-window \
            2>&1 | tee "$RUNNER_TEMP/desktop-smoke.log"
          grep -F '帮你Draw window OK:' "$RUNNER_TEMP/desktop-smoke.log"

      - name: Stage release artifacts
        run: |
          mkdir -p dist
          cp desktop/build/compose/binaries/main/deb/*.deb \
            "dist/bangnidraw-desktop-${GITHUB_REF_NAME}-linux-amd64.deb"
          (cd dist && sha256sum "bangnidraw-desktop-${GITHUB_REF_NAME}-linux-amd64.deb" \
            > "bangnidraw-desktop-${GITHUB_REF_NAME}-linux-amd64.deb.sha256")

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bangnidraw-release-linux-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  build-desktop-macos:
    name: Build macOS desktop package
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build desktop tests and dmg
        run: >-
          ./gradlew :engine-core:desktopTest :engine-gl:desktopTest
          :desktop:test :desktop:createDistributable
          :desktop:packageDistributionForCurrentOS

      - name: Verify macOS package
        id: mac_package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MAC_VERSION="${VERSION%%-*}"
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts)"
          test -n "$VERSION_CODE" || { echo "!! versionCode not found in app/build.gradle.kts" >&2; exit 1; }
          APP="$(find desktop/build/compose/binaries/main/app -name '*.app' -print -quit)"
          PLIST="$APP/Contents/Info.plist"
          PACKAGE_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          PACKAGE_BUILD_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"
          PACKAGE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$PLIST")"
          DISPLAY_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PLIST")"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")"
          test "$PACKAGE_VERSION" = "$MAC_VERSION"
          test "$PACKAGE_BUILD_VERSION" = "$VERSION_CODE"
          test "$PACKAGE_NAME" = "帮你Draw"
          test "$DISPLAY_NAME" = "帮你Draw"
          test "$BUNDLE_ID" = "ch.lkmc.bangnidraw.desktop"

          ICON_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$PLIST")"
          ICON="$APP/Contents/Resources/$ICON_NAME"
          test "$(shasum -a 256 "$ICON" | cut -d ' ' -f 1)" = \
            "$(shasum -a 256 desktop/packaging/icons/bangnidraw.icns | cut -d ' ' -f 1)"

          LAUNCHER="$(find "$APP/Contents/MacOS" -type f -print -quit)"
          test -x "$LAUNCHER"
          perl -e 'alarm shift; exec @ARGV' 60 "$LAUNCHER" --verify-runtime | grep -F '帮你Draw runtime OK:'

          ANGLE_RESOURCES="$APP/Contents/app/resources"
          EGL="$ANGLE_RESOURCES/libEGL.dylib"
          GLES="$ANGLE_RESOURCES/libGLESv2.dylib"
          LICENSE="$ANGLE_RESOURCES/LICENSE"
          NOTICES="$ANGLE_RESOURCES/LICENSES.chromium.html"
          test -f "$EGL"
          test -f "$GLES"
          test -f "$LICENSE"
          test -f "$NOTICES"

          NATIVE_ARCH="$(uname -m)"
          case "$NATIVE_ARCH" in
            arm64) ARCH="arm64" ;;
            x86_64) ARCH="x64" ;;
            *) echo "!! unsupported macOS architecture: $NATIVE_ARCH" >&2; exit 1 ;;
          esac
          test "$(lipo -archs "$EGL")" = "$NATIVE_ARCH"
          test "$(lipo -archs "$GLES")" = "$NATIVE_ARCH"
          codesign --verify --strict "$EGL"
          codesign --verify --strict "$GLES"

          perl -e 'alarm shift; exec @ARGV' 60 \
            "$LAUNCHER" --smoke-window 2>&1 | \
            tee "$RUNNER_TEMP/desktop-macos-smoke.log"
          grep -F '帮你Draw window OK:' "$RUNNER_TEMP/desktop-macos-smoke.log"
          grep -E 'I/EglEsContext: GL context: .*ANGLE' \
            "$RUNNER_TEMP/desktop-macos-smoke.log"

          echo "arch=$ARCH" >> "$GITHUB_OUTPUT"

      - name: Stage release artifacts
        env:
          MAC_ARCH: ${{ steps.mac_package.outputs.arch }}
        run: |
          mkdir -p dist
          cp desktop/build/compose/binaries/main/dmg/*.dmg \
            "dist/bangnidraw-desktop-${GITHUB_REF_NAME}-macos-${MAC_ARCH}.dmg"
          (cd dist && shasum -a 256 "bangnidraw-desktop-${GITHUB_REF_NAME}-macos-${MAC_ARCH}.dmg" \
            > "bangnidraw-desktop-${GITHUB_REF_NAME}-macos-${MAC_ARCH}.dmg.sha256")

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bangnidraw-release-macos-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release
    needs: [build, build-desktop-linux, build-desktop-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bangnidraw-release-apk-${{ github.sha }}
          path: dist

      - name: Download verified Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bangnidraw-release-linux-${{ github.sha }}
          path: dist

      - name: Download verified macOS artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bangnidraw-release-macos-${{ github.sha }}
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          # The product name, as the user sees it; the file basenames stay
          # ASCII (bangnidraw-vX.Y.Z) for shells and download managers.
          name: 帮你Draw ${{ github.ref_name }}
          body: |
            - **Android**: `bangnidraw-<tag>.apk` — sideload as usual
              (minSdk 29).
            - **Linux**: `bangnidraw-desktop-<tag>-linux-amd64.deb` — needs
              GLES from Mesa or your vendor driver; nothing else.
            - **macOS**: `bangnidraw-desktop-<tag>-macos-<arch>.dmg` bundles
              ANGLE for Metal. This unsigned developer preview requires
              Control-click → Open. Production still requires Developer ID
              signing and notarization.

            Desktop is mouse-first in this release line (no pen pressure
            yet — Phase 3 of DESKTOP.md). Both desktop builds include Mixbox
            pigment mixing (CC BY-NC 4.0, non-commercial).
          # Create-only: GitHub appends the generated notes below `body` on
          # first creation; a re-run that PATCHes the release overwrites the
          # stored body and drops them. To recover: re-append the notes in
          # the release UI, or delete the release (keeping the tag) and
          # re-run so it is recreated with fresh generated notes.
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/*.apk
            dist/*.deb
            dist/*.dmg
            dist/*.sha256
