# CI: prove every push to main and every PR — unit tests, Android lint, a
# debug APK uploaded as a rolling artifact, and both release configurations
# (the shipped one and the Mixbox-stripped one).
#
# Hardening (family contract):
#   - least-privilege token (contents: read)
#   - cancel superseded PR runs, but never an in-progress main run — a
#     permanently "cancelled" main commit masks breakage and breaks bisection
#   - timeout on every job so a wedged Gradle daemon can't burn runner hours

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Supply-chain gate: reject a tampered gradle-wrapper.jar.
      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # No explicit SDK install step: the ubuntu runner image ships the Android
      # SDK, and AGP resolves compileSdk android-37.0 against it (paired with
      # android.suppressUnsupportedCompileSdk in gradle.properties).
      - uses: gradle/actions/setup-gradle@v6

      - name: Test, lint, and assemble
        # The KMP libraries register no Android unit tests; their JVM suites
        # run on the desktop targets (DESKTOP.md Phase 1, M1/M2), and the
        # desktop shell's own tests ride the same job (M4).
        run: >-
          ./gradlew testDebugUnitTest lintDebug assembleDebug
          :engine-core:desktopTest :engine-gl:desktopTest :desktop:test

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: bangnidraw-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # The configuration that actually ships: release.yml's "Build release
      # APK" step runs exactly this — Mixbox in, R8 on — and until this step
      # existed nothing built it before a v* tag was already pushed. Neither
      # of the other two covers it: assembleDebug is unminified, and the
      # stripped release below swaps the source set R8 traverses. AGENTS.md's
      # own rule is that "works in debug, breaks in release" is almost always
      # a missing keep rule for a new reflection or serialization entry
      # point, and :engine-core and :engine-gl became separate modules three
      # PRs ago, so R8 now crosses a boundary that did not exist when
      # proguard-rules.pro was written.
      - name: Assemble the shipped release configuration
        run: ./gradlew assembleRelease

      # The stripped source set and its R8 graph differ from the default APK.
      - name: Assemble release without Mixbox
        run: ./gradlew -Pbangnidraw.mixbox=false assembleRelease

  # The desktop shell (DESKTOP.md Phase 1/2): JVM suites plus the jpackage
  # distributable. Ubuntu only — there is no cross-compilation, so macOS
  # packaging lives in the dispatched job below.
  desktop-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Supply-chain gate: reject a tampered gradle-wrapper.jar.
      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Test and build the desktop distributable
        # packageDeb exercises the deb metadata (version/vendor/charset)
        # that createDistributable never touches; rpmbuild is absent on
        # ubuntu runners, so Rpm stays a manual format. mixbox=false here is
        # deliberate coverage: this job pins the stripped desktop variant
        # (D12's gap) while the dispatched macOS job builds the default one,
        # so both variants build on every commit that touches them.
        run: >-
          ./gradlew :engine-core:desktopTest :engine-gl:desktopTest
          :desktop:test :desktop:createDistributable :desktop:packageDeb
          -Pbangnidraw.mixbox=false

      - name: Upload desktop distributable
        uses: actions/upload-artifact@v7
        with:
          name: bangnidraw-desktop-linux-${{ github.sha }}
          path: desktop/build/compose/binaries/main/**
          if-no-files-found: error
          retention-days: 14

  # macOS build: Dmg packaging and the ANGLE-on-Metal context can only be
  # produced on macOS hardware, and macOS minutes cost 10x — dispatch only.
  desktop-macos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Test and build the macOS distributable
        # packageDistributionForCurrentOS = the real Dmg on macOS. Built
        # WITHOUT -Pbangnidraw.mixbox=false deliberately: the default,
        # Mixbox-enabled variant is the one macOS users get, and the Linux
        # job already covers the stripped one.
        run: >-
          ./gradlew :engine-core:desktopTest :engine-gl:desktopTest
          :desktop:test :desktop:createDistributable
          :desktop:packageDistributionForCurrentOS

      - name: Upload macOS distributable
        # Built WITHOUT the uncommitted ANGLE dylibs — a build/smoke-test
        # artifact, not a shippable image: stage the dylibs into
        # desktop/packaging/angle/macos-<arch>/ before any release packaging.
        uses: actions/upload-artifact@v7
        with:
          name: bangnidraw-desktop-macos-${{ github.sha }}
          path: desktop/build/compose/binaries/main/**
          if-no-files-found: error
          retention-days: 14
